# Set default terminal
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# --- Palette ---
# bg:        #1E1E2E
# fg:        #CDD6F4
# muted:     #6C7086
# subtle:    #313244
# accent:    #0A8F6D
# on-accent: #11111B

# Remap prefix from `C-b` to `C-a`
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Status bar
set -g status-position bottom
set -g status-style "bg=#1E1E2E,fg=#CDD6F4"
set -g status-justify left
set -g status-left-length 40
set -g status-right ""

# Left status
set -g status-left " #[fg=#0A8F6D] #S"

# Window tabs
set -g window-status-separator ""
set -g window-status-format " #[fg=#6C7086] #I:#W "
set -g window-status-current-format " #[fg=#0A8F6D,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#0A8F6D"
set -g pane-border-lines single

# Messages and copy mode
set -g message-style "fg=#0A8F6D,bg=#1E1E2E,bold"
set -g message-command-style "fg=#0A8F6D,bg=#1E1E2E,bold"
set -g mode-style "fg=#11111B,bg=#0A8F6D,bold"

# Alerts
set -g window-status-activity-style "fg=#0A8F6D,bold"
set -g window-status-bell-style "fg=#0A8F6D,bold"

# Set tmux mouse on
set -g mouse on

# Start window index at 1
set -g base-index 1

# Start pane index at 1
setw -g pane-base-index 1

# Automatically renumber window
set -g renumber-windows on

# Escapetime
set-option -sg escape-time 10
