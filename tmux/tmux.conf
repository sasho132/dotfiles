# Set default terminal
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm*:RGB"

# --- Palette ---
# bg:        #1E1E2E
# fg:        #CDD6F4
# muted:     #6C7086
# subtle:    #313244
# accent:    #0A8F6D
# on-accent: #11111B

# Remap prefix from `C-b` to `C-a`
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Status bar
set -g status-position bottom
set -g status-style "bg=#1E1E2E,fg=#CDD6F4"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 50
set -g status-interval 5

# Left status
set -g status-left " #[fg=#0A8F6D] #S #[default]"

# Right status: mode/prefix/zoom state and a clock
set -g status-right "#[fg=#0A8F6D]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#6C7086]%H:%M "

# Window tabs
set -g window-status-separator ""
set -g window-status-format " #[fg=#6C7086] #I:#W #[default]"
set -g window-status-current-format "#[fg=#0A8F6D] #[fg=#0A8F6D,bold] #I:#W #[default]"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#0A8F6D"
set -g pane-border-lines single

# Messages and copy mode
set -g message-style "fg=#0A8F6D,bg=#1E1E2E,bold"
set -g message-command-style "fg=#0A8F6D,bg=#1E1E2E,bold"
set -g mode-style "fg=#11111B,bg=#0A8F6D,bold"

# Alerts
set -g window-status-activity-style "fg=#0A8F6D,bold"
set -g window-status-bell-style "fg=#0A8F6D,bold"

# Flag background activity in the window list, without a status-line message
setw -g monitor-activity on
set -g visual-activity off

# Set tmux mouse on
set -g mouse on

# Start window index at 1
set -g base-index 1

# Start pane index at 1
setw -g pane-base-index 1

# Automatically renumber window
set -g renumber-windows on

# Escapetime
set-option -sg escape-time 10

# --- Behaviour ---
# Keep more scrollback
set -g history-limit 50000

# Forward focus changes to applications (Neovim, etc.)
set -g focus-events on

# Vi-style keys in copy mode
setw -g mode-keys vi

# Clock mode colour
set -g clock-mode-colour "#0A8F6D"

# --- Modern terminal ---
# Extended keys: Neovim gets Shift+Enter, Ctrl+Enter, etc. correctly
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"

# Let applications write directly to the terminal (image previews, etc.)
set -g allow-passthrough on

# Killing a session switches to another instead of dropping out of tmux
set -g detach-on-destroy off

# Multi-client sizing and terminal tab titles
set -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Better word jumps in copy mode
set -g word-separators " "

# Keep `prefix :` command history across restarts
set -g history-file ~/.local/state/tmux/history

# --- Key bindings ---
# Split panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# Reload the config (overrides the default refresh-client binding on `r`)
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
